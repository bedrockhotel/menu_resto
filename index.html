<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bedrock Hotel Bali - Restaurant Menu</title>
  <!-- Swiper JS CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Header Bar */
    .header {
      background: linear-gradient(180deg, #1f1b15 0%, #0f0f0f 100%);
      padding: 16px 20px;
      text-align: center;
      border-bottom: 2px solid #c59d5f;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      position: relative;
      z-index: 10;
    }
    .header h1 {
      font-size: 1.15rem;
      color: #c59d5f;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .header p {
      font-size: 0.8rem;
      color: #d1d1d1;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    /* Slider Container */
    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0 30px 0;
      width: 100%;
    }
    .swiper {
      width: 100%;
      max-width: 480px;
      padding-bottom: 35px;
    }
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
    }
    .swiper-slide img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      object-fit: contain;
      border: 1px solid #2a251e;
    }

    /* Custom Swiper Controls */
    .swiper-button-next, .swiper-button-prev {
      color: #c59d5f !important;
      background: rgba(0,0,0,0.4);
      width: 38px !important;
      height: 38px !important;
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }
    .swiper-button-next:after, .swiper-button-prev:after {
      font-size: 16px !important;
      font-weight: bold;
    }
    .swiper-pagination-bullet {
      background: #666;
      opacity: 0.6;
    }
    .swiper-pagination-bullet-active {
      background: #c59d5f !important;
      width: 20px;
      border-radius: 5px;
      opacity: 1;
    }

    /* Floating Call Action */
    .footer-action {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 12px;
      background: rgba(18, 18, 18, 0.95);
      border-top: 1px solid #2a251e;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .btn-call {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #c59d5f 0%, #9e793b 100%);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(197, 157, 95, 0.3);
      width: 90%;
      max-width: 360px;
      transition: transform 0.2s;
    }
    .btn-call:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>BEDROCK HOTEL KUTA BALI</h1>
    <p>All Day Dining Restaurant Menu</p>
  </div>

  <!-- Main Slider Area -->
  <div class="slider-container">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="01-cover.jpg" alt="Cover Menu"></div>
        <div class="swiper-slide"><img src="02-appetizer.jpg" alt="Appetizer & Soup"></div>
        <div class="swiper-slide"><img src="03-asian-dishes1.jpg" alt="Asian Dishes"></div>
        <div class="swiper-slide"><img src="04-asian-dishes2.jpg" alt="Asian Dishes"></div>
        <div class="swiper-slide"><img src="05-main.jpg" alt="Main Courses & Burger"></div>
        <div class="swiper-slide"><img src="06-desert.jpg" alt="Pasta & Dessert"></div>
        <div class="swiper-slide"><img src="07-drinks1.jpg" alt="Drinks"></div>
        <div class="swiper-slide"><img src="08-drinks2.jpg" alt="Drinks"></div>
      </div>
      
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <!-- Bottom Call CTA Button -->
  <div class="footer-action">
    <a href="tel:6" class="btn-call">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      Call Room Service (Ext. 6)
    </a>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      loop: false,
      spaceBetween: 10,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>

</body>
</html>
